<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookmarks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1>My Favorite Sites</h1>
      <button id="theme-toggle" aria-label="Toggle light/dark mode">🌙</button>
    </div>
    <input type="text" id="search" placeholder="Search by name, category, or notes...">
  </header>

  <div id="filters"></div>
  <div id="links"></div>

  <footer>
    <p>Edit <code>links.json</code> to add more sites.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
